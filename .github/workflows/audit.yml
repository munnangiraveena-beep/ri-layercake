name: Audit

on:
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install pip-audit && pip install ./python && pip-audit
