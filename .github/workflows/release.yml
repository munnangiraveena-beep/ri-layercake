name: Release

# Run by hand (Actions → Release → Run workflow) for a dry run to TestPyPI.
# Push a tag such as v0.1.0 to publish to PyPI and create the GitHub release.
# Both use trusted publishing: no API tokens are stored anywhere.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('python/src/ri_layercake/__init__.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || (echo "Tag ${GITHUB_REF_NAME} does not match version $v" && exit 1)
      - name: Tests, lint and types must pass before anything is published
        working-directory: python
        run: |
          pip install -e ".[dev]"
          ruff check src tests
          mypy src
          pytest -q
      - run: pip install build twine && python -m build python --outdir python/dist && twine check --strict python/dist/*
      - name: The built wheel installs cleanly and imports
        run: |
          python -m venv /tmp/check && /tmp/check/bin/pip install python/dist/*.whl
          /tmp/check/bin/python -I -c "import ri_layercake, ri_layercake.risk; print(ri_layercake.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/*

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # No environment and no attestations: the dry run happens while the repo is still private.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: false

  pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
