[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ri-layercake"
dynamic = ["version"]
description = "Turn reinsurance programmes into presentation-ready towers and editable PowerPoint slides."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Banu Munnangi" }]
keywords = ["reinsurance", "excess of loss", "quota share", "stop loss", "tower", "powerpoint", "pptx", "insurance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
# One install gives everything: PowerPoint, Excel input, DataFrames and matplotlib plots.
dependencies = ["python-pptx>=1.0", "openpyxl>=3.1", "numpy>=1.23", "pandas>=1.5", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ri-layercake = "ri_layercake.cli:main"

[project.urls]
Homepage = "https://ri-layercake.vercel.app"
Documentation = "https://ri-layercake.vercel.app/how-to-use/"
Formulas = "https://ri-layercake.vercel.app/formulas/"
Source = "https://github.com/munnangiraveena-beep/ri-layercake"
Issues = "https://github.com/munnangiraveena-beep/ri-layercake/issues"
Changelog = "https://github.com/munnangiraveena-beep/ri-layercake/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/ri_layercake/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ri_layercake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "B905"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true
